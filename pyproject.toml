[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quiet-file-team-mcp"
version = "0.1.0"
description = "Six offline guidance tools for a local file-first agent team"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2"]

[project.scripts]
quiet-file-team-mcp = "quiet_file_team_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quiet_file_team_mcp"]

[dependency-groups]
dev = ["ruff==0.17.3"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S607"]
"**/test_*.py" = ["S101", "S105", "S106", "S108", "S607"]
