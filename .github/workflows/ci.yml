name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv run --with ruff==0.17.3 ruff format --check .
      - run: uv run --with ruff==0.17.3 ruff check .

  registry-metadata:
    name: Validate server.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: server.json and glama.json are valid JSON
        run: |
          python3 -m json.tool server.json > /dev/null
          python3 -m json.tool glama.json > /dev/null
      - name: Registry description stays within MCP 100-char limit
        run: |
          python3 - <<'PY'
          import json, sys
          desc = json.load(open("server.json"))["description"]
          n = len(desc)
          print(f"description length={n}/100")
          if n > 100:
              sys.stderr.write(
                  f"ERROR: MCP Registry requires body.description <= 100 chars; got {n}: {desc!r}\n"
              )
              sys.exit(1)
          PY
      - name: Versions and registry name stay in sync
        run: |
          v="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')" = "$v"
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["packages"][0]["version"])')" = "$v"
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["name"])')" = "io.github.pandadad0214/quiet-file-team-mcp"
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["packages"][0]["identifier"])')" = "quiet-file-team-mcp"
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["packages"][0]["transport"]["type"])')" = "stdio"
          grep -q 'quiet-file-team-mcp = "quiet_file_team_mcp.server:main"' pyproject.toml
          grep -q 'mcp-name: io.github.pandadad0214/quiet-file-team-mcp' README.md
          grep -q "__version__ = \"$v\"" src/quiet_file_team_mcp/__init__.py
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tgz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256} mcp-publisher.tgz" | sha256sum -c -
          tar xzf mcp-publisher.tgz mcp-publisher
      - run: ./mcp-publisher validate

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest build
      - run: pytest -q
      - run: python -m build
