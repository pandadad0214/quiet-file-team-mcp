name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pytest build
      - run: pytest -q
      - name: Match release version
        run: test "v$(python -c 'from quiet_file_team_mcp import __version__; print(__version__)')" = "$GITHUB_REF_NAME"
      - run: python -m build
      - run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - name: Create release with ready package downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Quiet File Team MCP $GITHUB_REF_NAME" --notes "Six offline guidance tools for a local file-first quiet team. Wheel, source archive and checksums. No paid API calls."
