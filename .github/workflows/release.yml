name: Release

# On a v* tag: verify versions, lint, test, build wheel + sdist, publish to PyPI
# (Trusted Publishing / OIDC, no stored token), then create the GitHub Release.
# Re-publish an existing tag to PyPI with: Actions -> Release -> Run workflow (tag = vX.Y.Z).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to PyPI (e.g. v0.1.1)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject, server.json and __init__
        run: |
          v="${TAG#v}"
          test "$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "$v"
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')" = "$v"
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["packages"][0]["version"])')" = "$v"
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["packages"][0]["identifier"])')" = "quiet-file-team-mcp"
          grep -q "__version__ = \"$v\"" src/quiet_file_team_mcp/__init__.py
      - name: Lint (ruff)
        run: |
          uv run --with ruff==0.17.3 ruff format --check .
          uv run --with ruff==0.17.3 ruff check .
      - name: Tests
        run: |
          python -m pip install . pytest
          pytest -q
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/quiet-file-team-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Keep only wheel and sdist
        run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete && ls dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  github-release:
    needs: pypi
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release-notes.md is a template: {{VERSION}} becomes the tag's version (no leading v).
          sed "s/{{VERSION}}/${GITHUB_REF_NAME#v}/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag --latest
