name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry when a release tag is pushed.
# Uses GitHub OIDC, so no registry token is stored in this repository.
# This stdio package is io.github.pandadad0214/quiet-file-team-mcp.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches server.json and pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          test "v$(python3 -c 'import json;print(json.load(open("server.json"))["version"])')" = "${GITHUB_REF_NAME}"
          test "v$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["packages"][0]["version"])')" = "${GITHUB_REF_NAME#v}"
          test "$(python3 -c 'import json;print(json.load(open("server.json"))["name"])')" = "io.github.pandadad0214/quiet-file-team-mcp"
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tgz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256} mcp-publisher.tgz" | sha256sum -c -
          tar xzf mcp-publisher.tgz mcp-publisher
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
